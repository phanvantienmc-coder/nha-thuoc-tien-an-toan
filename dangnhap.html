<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập nhân viên · Tiến An Toàn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dangnhap.css">
  <script src="taikhoan.js" defer></script>
</head>
<body>
  <header class="trangmenu">
    <a class="logo" href="/" aria-label="Nhà thuốc Tiến An Toàn — trang bán hàng"><svg class="daucong" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M11 2h10v9h9v10h-9v9H11v-9H2V11h9Z"/></svg><span><small>Nhà thuốc</small>Tiến An Toàn</span></a>
    <div class="taikhoan" data-nhanvien hidden><span><small>Nhân viên</small><strong data-tennhanvien></strong></span><button type="button" data-dangxuat>Đăng xuất</button></div>
    
    <button type="button" class="nutmenu" aria-expanded="false" aria-controls="menuchinh"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menu</span></button>
    <nav id="menuchinh" class="menu" aria-label="Điều hướng chính"><a href="/" ><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 5 3h14l2 7M4 10v11h16V10M3 10c0 3 5 3 5 0 0 3 4 3 4 0 0 3 4 3 4 0 0 3 5 3 5 0M9 21v-7h6v7"/></svg><span>Về trang bán hàng</span></a></nav>
  </header>
  <main class="dangnhap">
    <p>KHU VỰC NHÂN VIÊN</p>
    <h1>Đăng nhập quản lý</h1>
    <p>Dành cho nhân viên nhập kho và quản lý đơn hàng của nhà thuốc.</p>
    <form id="dangnhap">
      <label for="tendangnhap">Tên tài khoản</label>
      <input id="tendangnhap" name="ten" autocomplete="username" required maxlength="30" pattern="[A-Za-z0-9_ ]{3,30}">
      <label for="matkhau">Mật khẩu</label>
      <input id="matkhau" name="matKhau" type="password" autocomplete="current-password" required maxlength="128">
      <button type="submit">Đăng nhập</button>
      <p id="baodangnhap" role="status" aria-live="polite"></p>
    </form>
    <a href="/">Tiếp tục mua hàng →</a>
  </main>
</body>
</html>
